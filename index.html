                const c = m.current >= m.target;
                return (
                  <div key={m.id} className="flex items-center justify-between bg-[var(--bg)] p-2 rounded-xl border border-[var(--border)]">
                    <div className="flex flex-col pr-2"><span className={`text-xs font-bold ${c ? 'text-[var(--secondary)] line-through' : ''}`}>{m.desc}</span><span className="text-[10px] opacity-60 font-bold">{Math.min(m.current, m.target)} / {m.target}</span></div>
                    {c ? (m.claimed ? <span className="opacity-40 font-bold text-xs"><i className="bi bi-check"></i> 完了</span> : <button onClick={() => claim(m.id)} className="bg-[var(--accent)] text-[var(--text)] font-bold text-xs px-3 py-1 rounded border border-[var(--border)] shadow-sm">うけとる</button>) : <span className="font-bold text-xs opacity-60">+{m.reward} スコア</span>}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="w-full mt-2 text-center">
            <button className="opacity-50 font-bold py-2 hover:opacity-100 transition-opacity" onClick={() => { audioCtrl.playSE('click'); setView('manager') }}><i className="bi bi-gear"></i> 先生むけ：コース管理</button>
          </div>
        </div>
      );
    };

    // コースの複数選択（カルクと同じ形）。タップで ON/OFF。
    // 学年で隠れているぶんも含めて、えらんだコースは下のチップでいつでも見えて、はずせる
    const CourseMultiSelect = ({ filteredGroups, allGroups, selected, setSelected }) => {
      const toggle = (name) => { audioCtrl.playSE('click'); setSelected(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]); };
      const visibleNames = filteredGroups.map(g => g.name);
      const allVisibleSelected = visibleNames.length > 0 && visibleNames.every(n => selected.includes(n));
      const toggleAllVisible = () => { audioCtrl.playSE('click'); setSelected(prev => allVisibleSelected ? prev.filter(n => !visibleNames.includes(n)) : [...new Set([...prev, ...visibleNames])]); };
      const groupOf = (name) => allGroups.find(g => g.name === name);
      const totalCount = selected.reduce((sum, name) => sum + (groupOf(name)?.count || 0), 0);
      return (
        <div className="w-full">
          <div className="flex items-end justify-between mb-1 gap-2">
            <label className="text-xs font-bold opacity-70">コースをえらぶ（いくつでも OK）</label>
            {visibleNames.length > 0 && (
              <button type="button" onClick={toggleAllVisible} className="shrink-0 min-h-[48px] text-xs font-bold px-3 rounded-full border-2 border-[var(--border)] bg-[var(--bg)] text-[var(--text)]">
                {allVisibleSelected ? 'ぜんぶ はずす' : 'ぜんぶ えらぶ'}
              </button>
            )}
          </div>
          <div className="border-2 border-[var(--border)] rounded-xl bg-[var(--bg)] overflow-hidden">
            <div className="max-h-56 overflow-y-auto p-2 flex flex-col gap-1.5">
              {filteredGroups.length === 0 && <p className="text-center font-bold text-sm opacity-70 py-4">コースが ありません</p>}
              {filteredGroups.map(g => {
                const on = selected.includes(g.name);
                return (
                  <button key={g.name} type="button" onClick={() => toggle(g.name)} aria-pressed={on}
                    className={`min-h-[48px] flex items-center gap-2.5 px-2.5 rounded-lg border-2 text-left transition-colors ${on ? 'bg-[var(--accent)] border-[var(--text)]' : 'bg-[var(--panel)] border-transparent'}`}>
                    <span className={`w-6 h-6 shrink-0 rounded flex items-center justify-center border-2 ${on ? 'bg-[var(--secondary)] border-[var(--secondary)] text-white' : 'bg-[var(--panel)] border-[var(--text)]'}`}>{on && <i className="bi bi-check-lg"></i>}</span>
                    <span className="flex-grow font-bold text-sm text-[var(--text)] truncate">{g.d || g.name}</span>
                    <span className="shrink-0 text-xs font-bold text-[var(--text)] opacity-70">{g.count}問</span>
                  </button>
                );
              })}
            </div>
            <div className="border-t-2 border-dashed border-[var(--border)] bg-[var(--panel)] p-2 flex items-center gap-1.5 flex-wrap min-h-[48px]">
              {selected.length === 0 ? (
                <span className="font-bold text-xs opacity-70 px-1">コースを えらんでね</span>
              ) : (
                <>
                  <span className="shrink-0 font-black text-xs bg-[var(--text)] text-[var(--panel)] rounded-full px-2.5 py-1">{selected.length}こ / {totalCount}問</span>
                  {selected.map(name => (
                    <button key={name} type="button" onClick={() => toggle(name)} aria-label={`${courseLabel(name)} を はずす`} className="min-h-[36px] flex items-center gap-1 max-w-[180px] text-xs font-bold bg-[var(--bg)] border-2 border-[var(--border)] rounded-full pl-2.5 pr-1.5">
                      <span className="truncate">{groupOf(name)?.d || name}</span><i className="bi bi-x-circle opacity-60"></i>
                    </button>
                  ))}
                </>
              )}
            </div>
          </div>
        </div>
      );
    };

    // タイムアタックの問題数をえらぶ
    const CountPicker = ({ count, setCount, available }) => (
      <div>
        <div className="font-bold text-sm flex justify-between mb-2">
          <span className="opacity-70"><ruby>問題数<rt>もんだいすう</rt></ruby></span>
          <span className="text-[var(--primary)]">{available && available < count ? `${available}問（コースの ぜんぶ）` : `${count}問`}</span>
        </div>
        <div className="grid grid-cols-4 gap-2" role="radiogroup" aria-label="問題数">
          {TA_COUNTS.map(n => (
            <button key={n} type="button" role="radio" aria-checked={count === n}
              onClick={() => { audioCtrl.playSE('click'); setCount(n); }}
              className={`min-h-[48px] rounded-xl font-black border-2 transition-colors ${count === n ? 'bg-[var(--secondary)] border-[var(--secondary)] text-white shadow-sm' : 'bg-[var(--bg)] border-[var(--border)] text-[var(--text)]'}`}>
              {n}
            </button>
          ))}
        </div>
      </div>
    );

    // かだいリンクのダイアログ（先生むけ）。リンクと QR を出す
    const KadaiLinkDialog = ({ mode, courses, minutes, count, onClose }) => {
      const [title, setTitle] = useState('');
      const qrRef = useRef(null);
      const [qr, setQr] = useState('loading'); // loading | ok | long | error
      const linkCourses = courses.filter(n => n !== 'mistakes');
      const url = kadaiUrl(encodeKadai({ title, mode, courses: linkCourses, minutes, count }));
      const summary = describeKadai({ mode, courses: linkCourses, minutes, count });
      const droppedMistakes = linkCourses.length < courses.length;

      useEffect(() => {
        const box = qrRef.current; if (!box) return;
        box.innerHTML = '';
        if (url.length > KADAI_QR_MAX) { setQr('long'); return; }
        if (!window.QRCode) { setQr('error'); return; }
        try {
          new window.QRCode(box, { text: url, width: 200, height: 200, colorDark: '#000000', colorLight: '#ffffff', correctLevel: window.QRCode.CorrectLevel ? window.QRCode.CorrectLevel.L : undefined });
          setQr('ok');
        } catch (e) { box.innerHTML = ''; setQr('error'); }
      }, [url]);

      useEffect(() => { const h = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, [onClose]);

      return (
        <div className="fixed inset-0 z-[9000] bg-black/40 flex items-center justify-center p-4" onClick={onClose}>
          {/* 高さが足りない画面（横向きのタブレットなど）では、中身を縮めずにスクロールさせる。
              スクロールする枠そのものを flex にすると、QR の場所が縮んで QR が下の URL 欄に重なる */}
          <div role="dialog" aria-modal="true" aria-label="かだいリンク" className="card-pop w-full max-w-md max-h-[90dvh] overflow-y-auto text-[var(--text)]" onClick={e => e.stopPropagation()}>
           <div className="p-5 flex flex-col gap-3">
            <h2 className="font-black text-xl flex items-center gap-2"><i className="bi bi-link-45deg text-2xl text-[var(--secondary)]"></i> かだいリンク</h2>
            <p className="text-sm font-bold leading-relaxed">このリンクか QR を こどもに わたすと、ひらいたときに ホームに「かだい」が 出て、ボタン ひとつで この せっていの ゲームが はじまります。</p>
            <div className="text-sm font-black bg-[var(--bg)] border-2 border-[var(--border)] rounded-xl px-3 py-2 break-words">{summary}</div>
            {linkCourses.length > 1 && <p className="text-xs font-bold opacity-70 break-words">コース: {linkCourses.join('、')}</p>}
            {droppedMistakes && <p className="text-xs font-bold">にがて克服は、その子の まちがいなので かだいには 入れません。</p>}
            <label className="text-sm font-bold flex flex-col gap-1">
              かだいの なまえ（なくても よい・{KADAI_TITLE_MAX}もじまで）
              <input type="text" value={title} maxLength={KADAI_TITLE_MAX} onChange={e => setTitle(e.target.value)} placeholder="れい: きょうの しゅくだい" className="min-h-[48px] border-2 border-[var(--border)] rounded-xl px-3 font-bold bg-[var(--bg)] text-[var(--text)] outline-none focus:border-[var(--secondary)]" />
            </label>
            <p className="text-xs font-bold opacity-70">こどもの なまえは 入れないで ください。</p>
            <div className="flex flex-col items-center justify-center min-h-[100px] shrink-0">
              {qr === 'long' && <p className="text-sm font-bold text-center">もんだいが おおいので QR には できません。リンクを コピーして わたしてください。</p>}
              {qr === 'error' && <p className="text-sm font-bold text-center">QR を 出せませんでした。リンクを コピーして わたしてください。</p>}
              <div ref={qrRef} role="img" aria-label="かだいリンクの QR コード" className={qr === 'ok' ? 'bg-white p-3 rounded-xl border-2 border-[var(--border)]' : 'hidden'}></div>
            </div>
            <input type="text" readOnly value={url} aria-label="かだいリンクの URL" onFocus={e => e.target.select()} className="min-h-[48px] w-full border-2 border-[var(--border)] rounded-xl px-3 text-xs font-mono bg-[var(--bg)] text-[var(--text)]" />
            <MotionButton className="bg-[var(--secondary)] text-[var(--panel)] w-full py-3 border-none shadow-[0_4px_0_rgba(0,0,0,0.1)]" onClick={() => copyText(url, 'かだいリンクを コピーしました')}><i className="bi bi-clipboard"></i> リンクを コピー</MotionButton>
            <MotionButton autoFocus className="bg-[var(--bg)] text-[var(--text)] w-full py-3" onClick={onClose}>とじる</MotionButton>
           </div>
          </div>
        </div>
      );
    };

    const SingleConfigView = ({ setView, setState, configMode }) => {
      const [groups, setGroups] = useState([]); const [selected, setSelected] = useState([]); const [time, setTime] = useState(3); const [count, setCount] = useState(TA_COUNT_DEFAULT);
      const [selectedGrade, setSelectedGrade] = useState('すべて');
      const grades = ['すべて', '1年', '2年', '3年', '4年', '5年', '6年', 'その他'];

      useEffect(() => { const l = StorageAPI.getProblemGroups(); if (StorageAPI.getMistakes().length > 0) l.unshift({ name: 'mistakes', count: StorageAPI.getMistakes().length, d: '★ にがて克服' }); setGroups(l); }, []);

      const filteredGroups = groups.filter(g => {
        if (g.name === 'mistakes') return true;
        if (selectedGrade === 'すべて') return true;
        if (selectedGrade === 'その他') return !/^[1-6]年/.test(g.name);
        return g.name.startsWith(selectedGrade);
      });


      const start = () => {
        if (!selected.length) return showToast('warning', 'コースを えらんでね');
        const p = collectProblems(selected);
        if (!p.length) return showToast('error', '問題がありません');
        setState(buildPlayState(configMode, p, { minutes: time, count }, selected));
        setView('game');
      };
      const [kadaiOpen, setKadaiOpen] = useState(false);
      const openKadai = () => {
        if (!selected.length) return showToast('warning', 'コースを えらんでね');
        if (!selected.some(n => n !== 'mistakes')) return showToast('error', 'にがて克服は その子の まちがいなので かだいには できません');
        setKadaiOpen(true);
      };
      return (
        <div className="card-pop p-6 flex flex-col gap-5 mt-8">
          <h3 className="font-black text-xl text-center flex justify-center gap-2 text-[var(--text)]">
            <i className={`bi ${configMode==='SCORE_ATTACK'?'bi-award text-[var(--accent)]':configMode==='TIME_ATTACK'?'bi-stopwatch text-[var(--secondary)]':'bi-lightning text-[var(--primary)]'}`}></i> 
            {configMode === 'SCORE_ATTACK' ? 'スコアアタック' : configMode === 'TIME_ATTACK' ? 'タイムアタック' : 'サドンデス'}
          </h3>
          <div>
            <label className="text-xs font-bold opacity-70 mb-2 block">学年</label>
            <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
              {grades.map(grade => (
                <button 
                  key={grade}
                  onClick={() => { audioCtrl.playSE('click'); setSelectedGrade(grade); }}
                  className={`px-4 py-2 rounded-full whitespace-nowrap font-bold text-sm border-2 transition-colors flex-shrink-0 ${selectedGrade === grade ? 'bg-[var(--text)] border-[var(--text)] text-[var(--panel)] shadow-sm' : 'bg-[var(--bg)] border-transparent text-[var(--text)]'}`}
                >
                  {grade.includes('年') ? <>{grade.replace('年', '')}<ruby>年<rt>ねん</rt></ruby></> : grade}
                </button>
              ))}
            </div>
          </div>
          <CourseMultiSelect filteredGroups={filteredGroups} allGroups={groups} selected={selected} setSelected={setSelected} />
          {configMode === 'SCORE_ATTACK' && (
            <div>
              <label className="font-bold text-sm flex justify-between mb-2"><span className="opacity-70">制限時間</span><span className="text-[var(--primary)]">{time} 分</span></label>
              <input type="range" min="1" max="10" value={time} onChange={e => setTime(e.target.value)} className="w-full accent-[var(--primary)]" />
            </div>
          )}
          {configMode === 'TIME_ATTACK' && <CountPicker count={count} setCount={setCount} available={selected.length ? selected.reduce((sum, n) => sum + (groups.find(g => g.name === n)?.count || 0), 0) : undefined} />}
          <MotionButton className="bg-[var(--primary)] text-[var(--panel)] w-full py-4 text-xl mt-4 border-none shadow-[0_4px_0_rgba(0,0,0,0.1)]" onClick={start}>スタート！</MotionButton>
          <button type="button" className="w-full min-h-[48px] flex items-center justify-center gap-2 font-bold text-sm text-[var(--text)] border-2 border-dashed border-[var(--border)] rounded-xl bg-[var(--bg)]" onClick={() => { audioCtrl.playSE('click'); openKadai(); }}><i className="bi bi-link-45deg text-lg"></i> 先生むけ：この せっていで かだいリンクを つくる</button>
          <button className="opacity-50 font-bold py-2 hover:opacity-100 transition-opacity" onClick={() => { audioCtrl.playSE('click'); setView('home') }}>もどる</button>
          {kadaiOpen && <KadaiLinkDialog mode={configMode} courses={selected} minutes={time} count={count} onClose={() => setKadaiOpen(false)} />}
        </div>
      );
    };

    const HostRoomView = ({ peerState, setPeerState, broadcast, setView, setState, configMode, setConfigMode }) => {
      const [groups, setGroups] = useState([]); const [selected, setSelected] = useState([]); const [time, setTime] = useState(3); const [count, setCount] = useState(TA_COUNT_DEFAULT);
      const [selectedGrade, setSelectedGrade] = useState('すべて');
      const grades = ['すべて', '1年', '2年', '3年', '4年', '5年', '6年', 'その他'];

      useEffect(() => { const l = StorageAPI.getProblemGroups(); setGroups(l); }, []);
      
      const filteredGroups = groups.filter(g => {
        if (selectedGrade === 'すべて') return true;
        if (selectedGrade === 'その他') return !/^[1-6]年/.test(g.name);
        return g.name.startsWith(selectedGrade);
      });


      useEffect(() => { if (peerState.hostId && window.QRCode) { document.getElementById('qr').innerHTML=''; new window.QRCode(document.getElementById('qr'), { text: `${window.location.origin}${window.location.pathname}?host=${peerState.hostId}`, width: 120, height: 120, colorDark: "#4A4E69", colorLight: "#ffffff" }); } }, [peerState.hostId]);
      const start = () => {
        if (!selected.length) return showToast('warning', 'コースを えらんでね');
        const p = collectProblems(selected); if (!p.length) return showToast('error', '問題なし');
        const conf = buildPlayState(configMode, p, { minutes: time, count }, selected);
        setPeerState(ps => { const n = { ...ps, participants: {} }; Object.keys(ps.participants).forEach(k => n.participants[k] = { ...ps.participants[k], score: 0 }); n.participants[ps.hostId] = { id: ps.hostId, name: 'リーダー', score: 0 }; n.connections.forEach(c => c.send({ type: 'participants_update', data: n.participants })); return n; });
        setState(conf); broadcast({ type: 'game_start', data: conf }); setView('game');
      };
      return (
        <div className="flex flex-col h-[85vh] gap-3">
          <div className="card-pop p-4 flex flex-col items-center flex-grow overflow-y-auto">
            <h4 className="font-black text-4xl tracking-widest text-[var(--primary)] mb-2">{peerState.hostId}</h4>
            <div id="qr" className="bg-white p-2 rounded-xl mb-4 border-2 border-[var(--border)]"></div>
            
            <div className="w-full mb-3">
              <label className="text-xs font-bold opacity-70 mb-2 block">学年</label>
              <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                {grades.map(grade => (
                  <button 
                    key={grade}
                    onClick={() => { audioCtrl.playSE('click'); setSelectedGrade(grade); }}
                    className={`px-4 py-2 rounded-full whitespace-nowrap font-bold text-sm border-2 transition-colors flex-shrink-0 ${selectedGrade === grade ? 'bg-[var(--text)] border-[var(--text)] text-[var(--panel)] shadow-sm' : 'bg-[var(--bg)] border-transparent text-[var(--text)]'}`}
                  >
                    {grade.includes('年') ? <>{grade.replace('年', '')}<ruby>年<rt>ねん</rt></ruby></> : grade}
                  </button>
                ))}
              </div>
            </div>

            <div className="w-full mb-4"><CourseMultiSelect filteredGroups={filteredGroups} allGroups={groups} selected={selected} setSelected={setSelected} /></div>
            {configMode === 'SCORE_ATTACK' && (
              <div className="w-full mb-4">
                <label className="font-bold text-sm flex justify-between mb-2"><span className="opacity-70">制限時間</span><span className="text-[var(--primary)]">{time} 分</span></label>
                <input type="range" min="1" max="10" value={time} onChange={e => setTime(e.target.value)} className="w-full accent-[var(--primary)]" />
              </div>
            )}
            {configMode === 'TIME_ATTACK' && <div className="w-full mb-4"><CountPicker count={count} setCount={setCount} available={selected.length ? selected.reduce((sum, n) => sum + (groups.find(g => g.name === n)?.count || 0), 0) : undefined} /></div>}
            <div className="w-full bg-[var(--bg)] p-3 rounded-xl border-2 border-[var(--border)] overflow-y-auto max-h-40">
              {Object.values(peerState.participants).map(p => <div key={p.id} className="font-bold border-b border-[var(--border)] py-2 text-sm">{p.name} <span className="float-right text-[var(--primary)]">{p.score}pt</span></div>)}
            </div>
          </div>
          <MotionButton className="bg-[var(--primary)] text-[var(--panel)] w-full py-4 text-xl border-none shadow-[0_4px_0_rgba(0,0,0,0.1)]" onClick={start}>全員でスタート！</MotionButton>
        </div>
      );
    };

    const ClientJoinView = ({ initClient, urlHostId, setView }) => {
      const [name, setName] = useState(''); const [id, setId] = useState(urlHostId || '');
      return (
        <div className="card-pop p-6 text-center mt-10">
          <h3 className="font-black text-2xl mb-6 text-[var(--text)]"><i className="bi bi-person-plus text-[var(--secondary)]"></i> へやに入る</h3>
          <div className="text-left mb-4">
            <label className="text-xs font-bold opacity-70 ml-1">ルーム番号</label>
            <input type="text" className="w-full border-2 border-[var(--border)] rounded-xl p-3 font-black text-2xl text-center bg-[var(--bg)] outline-none focus:border-[var(--secondary)] transition-colors" placeholder="123456" value={id} onChange={e => setId(e.target.value.replace(/[^0-9]/g, ''))} />
          </div>
          <div className="text-left mb-8">
            <label className="text-xs font-bold opacity-70 ml-1">あなたのなまえ</label>
            <input type="text" className="w-full border-2 border-[var(--border)] rounded-xl p-3 font-bold text-xl text-center bg-[var(--bg)] outline-none focus:border-[var(--secondary)] transition-colors" placeholder="なまえ" value={name} onChange={e => setName(e.target.value)} />
          </div>
          <MotionButton className="bg-[var(--secondary)] text-[var(--panel)] w-full py-4 text-xl border-none shadow-[0_4px_0_rgba(0,0,0,0.1)]" onClick={() => initClient(name, id)}>入る！</MotionButton>
          <button className="opacity-50 font-bold mt-6 hover:opacity-100 transition-opacity" onClick={() => setView('home')}>もどる</button>
        </div>
      );
    };

    const ClientWaitView = ({ peerState, leaveRoom }) => (
      <div className="card-pop p-8 text-center mt-10">
        <div className="animate-spin text-5xl mb-6"><i className="bi bi-arrow-repeat text-[var(--secondary)]"></i></div>
        <h3 className="font-black text-2xl mb-4 text-[var(--text)]">準備OK！</h3><p className="font-bold mb-8 opacity-70">リーダーがスタートするまで<br/>待ってね</p>
        <button className="opacity-50 font-bold underline hover:opacity-100 transition-opacity" onClick={leaveRoom}>やめる</button>
      </div>
    );

    const GameView = ({ state, setState, setView, stats, setStats, peerState, setPeerState, addGlobalScore }) => {
      const [score, setScore] = useState(0); const [combo, setCombo] = useState(0); const [maxCombo, setMaxCombo] = useState(0);
      const [qIndex, setQIndex] = useState(0); const [ans, setAns] = useState(''); const [correctCount, setCorrectCount] = useState(0);
      const [startT] = useState(Date.now()); const [currT, setCurrT] = useState(Date.now());
      const elap = Math.floor((currT - startT) / 1000); const rem = Math.max(0, state.timeLimitSec - elap);
      const [memo, setMemo] = useState(false); const canvasRef = useRef(null); const mistakesRef = useRef([]); const correctRef = useRef([]);

      const isM = peerState && peerState.role;
      const top3 = isM ? Object.values(peerState.participants).sort((a,b)=>b.score-a.score).slice(0,3) : [];

      useEffect(() => { let id; const u = () => { setCurrT(Date.now()); id = requestAnimationFrame(u); }; u(); return () => cancelAnimationFrame(id); }, []);
      useEffect(() => {
        if (isM) {
          if (peerState.role === 'client' && peerState.conn) peerState.conn.send({ type: 'score_update', data: { score, combo } });
          else if (peerState.role === 'host') setPeerState(p => { if (!p.participants[p.hostId]) return p; const n = { ...p, participants: { ...p.participants, [p.hostId]: { ...p.participants[p.hostId], score, combo } } }; n.connections.forEach(c => c.send({ type: 'participants_update', data: n.participants })); return n; });
        }
      }, [score, combo]);
      useEffect(() => { if (state.gameMode === 'SCORE_ATTACK' && rem <= 0) finish(); }, [rem]);

      const finish = useCallback(() => {
        if (mistakesRef.current.length > 0) StorageAPI.addMistakes(mistakesRef.current);
        // にがて克服をえらんだときは、正解した問題をにがて克服からはずす（まちがえた問題は残す）
        if ((state.courseNames || []).includes('mistakes')) StorageAPI.removeMistakes(correctRef.current.filter(q => !mistakesRef.current.some(m => m.q === q.q)));
        let n = { ...stats }; const sec = Number(((Date.now() - startT) / 1000).toFixed(1));
        
        let gameScore = score;
        if (state.gameMode === 'TIME_ATTACK') gameScore = 1000 + Math.max(0, Math.floor(state.problemSet.length * 6 - sec) * 10); // 1問6秒が目安（20問なら120秒で、以前と同じ）
        if (state.gameMode === 'SUDDEN_DEATH') gameScore = correctCount * 50;
        
        n = StorageAPI.updateDailyAndMissions(n, gameScore, maxCombo, 1, state.gameMode, correctCount);
        StorageAPI.saveStats(n); setStats(n);
        if (state.kadaiId && !isM) KadaiStore.markDone(state.kadaiId);

        // 1問以上正解した場合のみ、プレイ完了報酬(+5)を付与する
        const earnedGlobalScore = correctCount > 0 ? 5 : 0;
        if (earnedGlobalScore > 0) {
            addGlobalScore(earnedGlobalScore);
        }

        setState(p => ({ 
          ...p, 
          finalGameScore: gameScore, 
          finalCombo: maxCombo, 
          finalTime: sec, 
          finalCorrect: correctCount, 
          earnedGlobalScore: earnedGlobalScore, 
          mistakes: mistakesRef.current 
        }));
        
        if (isM) { if (peerState.role === 'client') peerState.conn.send({ type: 'game_finish', data: { finalScore: gameScore } }); else peerState.connections.forEach(c => c.send({ type: 'game_finish' })); }
        setView('result');
      }, [stats, state.gameMode, state.courseName, state.problemSet, state.kadaiId, startT, setStats, setState, setView, peerState, addGlobalScore, score, maxCombo, correctCount]);

      const submit = useCallback(() => {
        if (!ans) return; const q = state.problemSet[qIndex]; const normAns = normalizeStr(ans);
        if (q.a.some(a => normalizeStr(a) === normAns)) {
          const nc = combo + 1; audioCtrl.playSE('correct'); if (nc > 1) audioCtrl.playSE('combo', nc);
          if (nc % 10 === 0) triggerConfetti({ particleCount: 50, spread: 60, origin: { y: 0.8 }, zIndex: 9999 });
          setScore(s => s + 100 + (combo * 10)); setCombo(nc); setMaxCombo(m => Math.max(m, nc)); setCorrectCount(c => c + 1);
          setAns(''); canvasRef.current?.clear(); correctRef.current.push({ q: q.q });
          if (state.gameMode === 'TIME_ATTACK' && correctCount + 1 >= state.problemSet.length) setTimeout(finish, 500);
          else setQIndex(i => (i + 1) % state.problemSet.length);
        } else {
          audioCtrl.playSE('wrong'); setCombo(0); setAns(''); mistakesRef.current.push({ q: q.q, a: q.a });
          if (state.gameMode === 'SUDDEN_DEATH') setTimeout(finish, 500);
        }
      }, [ans, qIndex, combo, correctCount, state.problemSet, state.gameMode, finish]);

      useEffect(() => {
        const handleKey = (e) => {
          if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
          const key = e.key;
          if ((key >= '0' && key <= '9') || ['.', '/', '-', '(', ')'].includes(key)) { audioCtrl.playSE('click'); setAns(a => (a.length < 15 ? a + key : a)); }
          else if (key === 'Backspace') { audioCtrl.playSE('click'); setAns(a => a.slice(0, -1)); }
          else if (key === 'Enter') { e.preventDefault(); submit(); }
          else if (key === 'Escape' || key === 'Delete' || key.toLowerCase() === 'c') { audioCtrl.playSE('click'); setAns(''); }
        };
        window.addEventListener('keydown', handleKey); return () => window.removeEventListener('keydown', handleKey);
      });

      const q = state.problemSet[qIndex] || { q: '?', a: ['?'] };
      const dSec = state.gameMode === 'SCORE_ATTACK' ? rem : elap;
      const prog = state.gameMode === 'SCORE_ATTACK' ? (rem / state.timeLimitSec) * 100 : (correctCount / state.problemSet.length) * 100;

      return (
        <div className="absolute inset-0 flex flex-col z-10 bg-[var(--bg)]">
          {state.gameMode !== 'SUDDEN_DEATH' && <div className="h-2 w-full bg-[var(--border)] relative"><div className="h-full bg-[var(--secondary)] transition-all duration-200" style={{ width: `${prog}%` }}></div></div>}
          {isM && top3.length > 0 && (
            <div className="flex justify-center gap-2 p-2 bg-[var(--panel)] border-b-2 border-[var(--border)] shadow-sm">
              {top3.map((p, i) => <div key={p.id} className="text-[10px] font-bold bg-[var(--bg)] px-3 py-1 rounded-full border border-[var(--border)]">{i+1}位 {p.name}: <span className="text-[var(--primary)]">{p.score}</span></div>)}
            </div>
          )}
          <div className={`flex flex-col md:flex-row h-full p-4 pb-12 sm:pb-16 md:pb-8 gap-4 ${memo ? 'md:w-full' : 'max-w-lg mx-auto w-full'}`}>
            <div className="flex flex-col flex-1 shrink-0">
              <div className="flex justify-between font-black text-2xl mb-2 opacity-80"><span className={state.gameMode==='SCORE_ATTACK'&&rem<=10?'text-red-500 animate-pulse':''}><i className="bi bi-clock"></i> {Math.floor(dSec/60)}:{(dSec%60).toString().padStart(2,'0')}</span><span className="text-[var(--primary)]">{state.gameMode==='TIME_ATTACK'?`${correctCount}/${state.problemSet.length}問`:state.gameMode==='SUDDEN_DEATH'?`${correctCount}問`:`${score}pt`}</span></div>
              <div className="flex-grow flex flex-col justify-center items-center relative min-h-[120px]">
                {combo > 1 && <div className="absolute top-0 bg-[var(--accent)] px-4 py-1 rounded-full font-black text-sm border-2 border-white shadow-sm text-white">{combo} COMBO!</div>}
                <div className={`${q.q.length > 24 ? 'text-2xl sm:text-3xl md:text-4xl leading-relaxed' : q.q.length > 12 ? 'text-3xl sm:text-4xl md:text-5xl leading-tight' : 'text-4xl sm:text-5xl md:text-6xl leading-tight tracking-wider'} font-black break-words w-full text-center text-[var(--text)]`}><MathText text={q.q} /></div>
              </div>
              <div className="h-20 bg-[var(--panel)] border-2 border-[var(--border)] rounded-2xl flex items-center justify-center relative mb-4 shadow-sm">
                <span className="text-4xl font-black text-[var(--secondary)] tracking-widest">{ans || <span className="opacity-20">?</span>}</span>
                <button className={`absolute right-3 w-12 h-12 rounded-full flex items-center justify-center text-xl transition-colors ${memo?'bg-[var(--secondary)] text-white shadow-md':'bg-[var(--bg)] text-[var(--text)] opacity-50'}`} onClick={()=>{audioCtrl.playSE('click'); setMemo(!memo)}}><i className="bi bi-pen"></i></button>
              </div>
              <div className="grid grid-cols-4 gap-2 h-48 shrink-0 mb-4 sm:mb-8">
                <div className="col-span-3 grid grid-cols-3 gap-2">
                  {['7','8','9','4','5','6','1','2','3','.','0','C'].map(n => (
                    <button key={n} className={`num-key ${n==='C'?'!bg-gray-300 !text-white !border-gray-300 !shadow-[0_4px_0_#9ca3af]':''}`} onPointerDown={(e)=>{e.preventDefault(); audioCtrl.playSE('click'); n==='C'?setAns(''):setAns(a=>a.length<15?a+n:a)}}>{n}</button>
                  ))}
                </div>
                <div className="flex flex-col gap-2">
                  {['/','-','(',')'].map(c => <button key={c} className="symbol-key" onPointerDown={(e)=>{e.preventDefault(); audioCtrl.playSE('click'); setAns(a=>a.length<15?a+c:a)}}>{c}</button>)}
                  <button className="flex-[2] bg-[var(--secondary)] text-white rounded-[16px] font-black text-xl border-2 border-[var(--secondary)] shadow-[0_4px_0_rgba(0,0,0,0.1)] active:shadow-none active:translate-y-1 transition-all outline-none" onPointerDown={(e)=>{e.preventDefault(); submit()}}>OK</button>
                </div>
              </div>
            </div>
            {memo && <div className="flex-1 min-h-[300px] h-full"><HandWritingCanvas ref={canvasRef} /></div>}
          </div>
        </div>
      );
    };

    const ResultView = ({ state, setView, peerState, leaveRoom, onStartKadai }) => {
      const { earnedGlobalScore, finalGameScore, finalTime, finalCorrect } = state;

      useEffect(() => { triggerConfetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#E07A5F', '#81B29A', '#F2CC8F'] }); }, []);
      
      const isM = peerState && peerState.role;
      const ranks = isM ? Object.values(peerState.participants).sort((a,b)=>b.score-a.score) : [];
      return (
        <div className="flex flex-col h-full py-6">
          <h2 className="font-black text-5xl text-center text-[var(--primary)] mb-6 tracking-widest">FINISH!</h2>
          {isM ? (
            <div className="card-pop p-4 mb-6 flex-grow overflow-y-auto">
              <h3 className="font-black text-xl mb-4 text-center text-[var(--text)]">ランキング</h3>
              {ranks.map((p,i) => <div key={p.id} className="flex justify-between items-center border-b border-[var(--border)] p-3 font-bold"><span className="text-lg text-[var(--text)]">{i+1}位 {p.name}</span><span className="text-2xl text-[var(--primary)]">{p.score}pt</span></div>)}
            </div>
          ) : (
            <div className="card-pop p-6 text-center mb-6">
              <h4 className="font-bold opacity-70 mb-2 text-[var(--text)]">{state.gameMode==='TIME_ATTACK'?'CLEAR TIME':state.gameMode==='SUDDEN_DEATH'?'連続正解':'GAME SCORE'}</h4>
              <div className="text-7xl font-black text-[var(--text)] mb-6">{state.gameMode==='TIME_ATTACK'?`${finalTime}秒`:state.gameMode==='SUDDEN_DEATH'?`${finalCorrect}問`:finalGameScore}</div>
              
              {earnedGlobalScore > 0 ? (
                <div className="bg-[var(--bg)] border-2 border-[var(--border)] rounded-xl p-4 inline-block">
                  <p className="text-sm font-bold text-[var(--text)] opacity-80 mb-1">ドリルクリアボーナス！</p>
                  <div className="text-2xl font-black text-[var(--secondary)]">+{earnedGlobalScore} スコア</div>
                </div>
              ) : (
                <div className="text-sm font-bold text-[var(--primary)] opacity-80 mb-1">
                  1問以上正解するとスコアがもらえるよ！
                </div>
              )}
            </div>
          )}
          {state.mistakes.length > 0 && (
            <div className="card-pop p-4 mb-6 max-h-48 overflow-y-auto">
              <h4 className="font-bold text-[var(--primary)] mb-3 flex items-center gap-2"><i className="bi bi-pen"></i> おさらい</h4>
              {state.mistakes.map((m,i)=><div key={i} className="text-sm font-bold border-b border-dashed border-[var(--border)] py-2 text-[var(--text)]">{m.q} <i className="bi bi-arrow-right opacity-50 mx-2"></i> <span className="text-[var(--primary)] text-lg">{(Array.isArray(m.a) ? m.a : String(m.a).split('|')).join(' または ')}</span></div>)}
            </div>
          )}
          {isM ? (
            <div className="flex flex-col gap-3 mt-auto">
              {peerState.role === 'host' && <MotionButton className="bg-[var(--secondary)] text-white w-full py-4 text-xl border-none shadow-[0_4px_0_rgba(0,0,0,0.1)]" onClick={()=>setView('hostRoom')}>もう一回あそぶ</MotionButton>}
              <button className="font-bold opacity-50 py-3 hover:opacity-100 transition-opacity" onClick={leaveRoom}>退出してホームへ</button>
            </div>
          ) : (
            <div className="flex flex-col gap-3 mt-auto">
              {state.kadaiId && <MotionButton className="bg-[var(--secondary)] text-[var(--panel)] w-full py-4 text-xl border-none shadow-[0_4px_0_rgba(0,0,0,0.1)]" onClick={onStartKadai}><i className="bi bi-arrow-repeat"></i> かだいを もういちど</MotionButton>}
              <MotionButton className="bg-[var(--primary)] text-[var(--panel)] w-full py-4 text-xl border-none shadow-[0_4px_0_rgba(0,0,0,0.1)]" onClick={()=>setView('home')}>ホームへもどる</MotionButton>
            </div>
          )}
        </div>
      );
    };

    const ManagerView = ({ setView }) => {
      const [groups, setGroups] = useState([]);
      useEffect(() => { setGroups(StorageAPI.getProblemGroups()); }, []);
      const del = (n) => { if(confirm('削除しますか？')){ StorageAPI.deleteProblemGroup(n); setGroups(StorageAPI.getProblemGroups()); showToast('success','削除しました');} };
      const copy = (n) => {
        const code = StorageAPI.encodeCourse(n, StorageAPI.getProblemsByGroup(n));
        const textArea = document.createElement("textarea"); textArea.value = code; document.body.appendChild(textArea); textArea.select();
        try { document.execCommand('copy'); showToast('success','共有コードをコピーしました'); } catch (err) { showToast('error', 'コピー失敗'); }
        document.body.removeChild(textArea);
      }
      return (
        <div className="flex flex-col h-[85vh] mt-4">
          <h3 className="font-bold text-xl mb-4 text-center text-[var(--text)]"><i className="bi bi-gear text-[var(--secondary)]"></i> コース管理</h3>
          <div className="card-pop flex-grow overflow-y-auto p-4 mb-4">
            {groups.map(g => (
              <div key={g.name} className="flex justify-between items-center border-b border-dashed border-[var(--border)] py-3 font-bold text-sm text-[var(--text)]">
                <span>{g.name} <span className="text-xs opacity-50 ml-1">({g.count}問)</span></span>
                <div className="flex gap-2">
                  <button className="bg-[var(--bg)] text-[var(--text)] px-3 py-1.5 rounded-lg border border-[var(--border)] hover:bg-[var(--secondary)] hover:text-white transition-colors" onClick={()=>copy(g.name)}><i className="bi bi-share"></i></button>
                  {!StorageAPI.isPreset(g.name) && <button className="bg-red-50 text-[var(--primary)] px-3 py-1.5 rounded-lg border border-red-200 hover:bg-[var(--primary)] hover:text-white transition-colors" onClick={()=>del(g.name)}><i className="bi bi-trash"></i></button>}
                </div>
              </div>
            ))}
          </div>
          <MotionButton className="bg-[var(--secondary)] text-[var(--panel)] w-full py-4 mb-3 border-none shadow-[0_4px_0_rgba(0,0,0,0.1)]" onClick={()=>setView('import')}><i className="bi bi-download"></i> コースを追加 (AI/共有)</MotionButton>
          <button className="font-bold py-3 opacity-50 hover:opacity-100 transition-opacity" onClick={()=>setView('home')}>もどる</button>
        </div>
      );
    };

    const ImportView = ({ setView }) => {
      const [text, setText] = useState(''); const [mode, setMode] = useState('code');
      const copyPrompt = () => {
        const prompt = `あなたは日本の小学校教育に精通したベテラン教師アシスタントです。\n指定の学年・単元の計算問題を作成します。\n# 出力ルール\n1. 形式: CSV形式（問題,答え）\n2. 正解が複数考えられる場合は「|」で区切る\n3. ヘッダーなし\n4. コードブロック内にCSVデータのみを出力`;
        const textArea = document.createElement("textarea"); textArea.value = prompt; document.body.appendChild(textArea); textArea.select();
        try { document.execCommand('copy'); showToast('success', 'プロンプトをコピーしました'); } catch (err) {} document.body.removeChild(textArea);
      };
      const proc = () => {
        if(!text.trim()) return showToast('warning', '空です');
        if (mode === 'code') {
          const d = StorageAPI.decodeCourse(text.trim());
          if (d) { StorageAPI.saveProblemSet(`受信_${d.name}`, d.problems); showToast('success', `${d.name} を追加しました`); setView('manager'); }
          else showToast('error', '正しいコードではありません');
        } else {
          const p = []; text.split('\n').forEach(l=>{const a=l.split(/[,]/); if(a.length>=2 && a[0]!=='問題') p.push({q:a[0].trim(), a:a[1].trim().split('|')});});
          if(p.length){ StorageAPI.saveProblemSet(`AI自作_${new Date().toLocaleDateString()}`, p); showToast('success', `${p.length}問保存しました`); setView('manager'); }
          else showToast('error', '読み込めませんでした');
        }
      };
      return (
        <div className="flex flex-col h-[85vh] mt-4">
          <h3 className="font-bold text-xl mb-4 text-center text-[var(--text)]"><i className="bi bi-download text-[var(--secondary)]"></i> コースを追加</h3>
          <div className="flex gap-2 mb-4 bg-[var(--panel)] p-1 rounded-xl border-2 border-[var(--border)]">
            <button onClick={() => setMode('code')} className={`flex-1 py-2 rounded-lg font-bold text-sm transition-colors ${mode === 'code' ? 'bg-[var(--text)] text-[var(--panel)]' : 'text-[var(--text)] opacity-60'}`}>共有コード</button>
            <button onClick={() => setMode('ai')} className={`flex-1 py-2 rounded-lg font-bold text-sm transition-colors ${mode === 'ai' ? 'bg-[var(--text)] text-[var(--panel)]' : 'text-[var(--text)] opacity-60'}`}>AI(CSV)</button>
          </div>
          <div className="card-pop flex-grow flex flex-col p-5 gap-4 mb-4">
            <p className="text-xs font-bold opacity-70 text-[var(--text)]">{mode === 'code' ? 'もらった「共有コード」を貼り付けてください。' : 'AI(ChatGPT等)が作った「問題,答え」のリストを貼り付けてください。'}</p>
            {mode === 'ai' && <button className="border-2 border-[var(--secondary)] text-[var(--secondary)] font-bold rounded-xl py-2 text-sm bg-[var(--bg)] hover:bg-[var(--secondary)] hover:text-white transition-colors" onClick={copyPrompt}>AIへの指示(プロンプト)をコピー</button>}
            <textarea className="flex-grow border-2 border-[var(--border)] rounded-xl p-3 text-sm font-mono bg-[var(--bg)] text-[var(--text)] outline-none focus:border-[var(--secondary)]" value={text} onChange={e=>setText(e.target.value)} placeholder={mode==='code'?'eyJu...':'1+1,2\n2×3,6'}></textarea>
            <MotionButton className="bg-[var(--primary)] text-white py-4 text-lg border-none shadow-md" onClick={proc}>追加する</MotionButton>
          </div>
          <button className="font-bold py-3 opacity-50 hover:opacity-100 transition-opacity" onClick={()=>setView('manager')}>もどる</button>
        </div>
      );
    };

    // ==========================================
    // 5. アプリケーション本体
    // ==========================================
    const App = () => {
      const [view, setView] = useState('loading');
      const [configMode, setConfigMode] = useState('SCORE_ATTACK');
      const [state, setState] = useState({ problemSet: [], timeLimitSec: 0, courseName: '', finalGameScore: 0, finalCombo: 0, earnedGlobalScore: 0, previousGlobalScore: 0, gameMode: 'SCORE_ATTACK', mistakes: [] });
      const [stats, setStats] = useState(StorageAPI.getStats());
      const [isMuted, setIsMuted] = useState(audioCtrl.muted);
      
      // おんたまドリルのグローバルスコアを管理
      const [globalScore, setGlobalScore] = useState(parseInt(localStorage.getItem('gogo_drill_score') || '0', 10));

      const addGlobalScore = useCallback((points) => {
        setGlobalScore(prev => {
          const next = prev + points;
          localStorage.setItem('gogo_drill_score', next.toString());
          return next;
        });
      }, []);

      const scriptsLoaded = useExternalScripts();

      // かだい（先生から受けとった設定）
      const [kadai, setKadai] = useState(() => KadaiStore.get());
      const receiveKadaiFromHash = useCallback(() => {
        const code = readKadaiHash(window.location.hash);
        if (!code) return false;
        window.history.replaceState({}, '', window.location.pathname + window.location.search); // 読んだらアドレスから消す
        if (!decodeKadai(code)) { showToast('error', 'かだいリンクを 読めませんでした'); return false; }
        KadaiStore.receive(code);
        setKadai(KadaiStore.get());
        showToast('success', 'かだいを うけとりました');
        return true;
      }, []);
      useEffect(() => {
        const h = () => { if (receiveKadaiFromHash() && !pRef.current.role) setView(v => (v === 'game' ? v : 'home')); };
        window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h);
      }, [receiveKadaiFromHash]);
      useEffect(() => { if (view === 'home') setKadai(KadaiStore.get()); }, [view]);
      const startKadai = () => {
        const k = KadaiStore.get();
        if (!k) { setKadai(null); return showToast('error', 'かだいが 見つかりません'); }
        const p = k.courses.flatMap(n => k.custom[n] || StorageAPI.getProblemsByGroup(n));
        if (!p.length) return showToast('error', '問題がありません');
        setState(buildPlayState(k.mode, p, { minutes: k.minutes, count: k.count }, k.courses, { kadaiId: k.id }));
        setView('game');
      };
      const closeKadai = () => {
        if (!confirm('かだいを しまいますか？（もういちど リンクを ひらけば もどります）')) return;
        KadaiStore.clear(); setKadai(null);
      };
      const [urlHostId, setUrlHostId] = useState(null);
      const [peerState, setPeerState] = useState({ role: null, peer: null, conn: null, hostId: null, myName: '', connections: [], participants: {} });
      const pRef = useRef(peerState); useEffect(() => { pRef.current = peerState; }, [peerState]);

      useEffect(() => {
        const h = new URLSearchParams(window.location.search).get('host');
        receiveKadaiFromHash();
        if (h) { setUrlHostId(h); setView('clientJoin'); window.history.replaceState({}, '', window.location.pathname); }
        else setTimeout(() => setView('home'), 1500);
      }, []);

      useEffect(() => {
        if (!isMuted) {
          if (view === 'game') audioCtrl.playBGM('game');
          else if (view === 'result') audioCtrl.stopBGM();
          else if (view !== 'loading') audioCtrl.playBGM('home');
        } else {
          audioCtrl.stopBGM();
        }
      }, [view, isMuted]);

      const initHost = () => {
        if (!window.Peer) return showToast('error', '通信準備中');
        const id = Math.floor(100000 + Math.random() * 900000).toString(); const p = new window.Peer(id);
        p.on('open', (i) => { setPeerState(x => ({ ...x, role: 'host', peer: p, hostId: i, participants: {}, connections: [] })); setView('hostRoom'); });
        p.on('connection', (c) => {
          c.on('open', () => setPeerState(x => ({ ...x, connections: [...x.connections, c] })));
          c.on('data', (d) => {
            if (d.type === 'join') setPeerState(x => { const n = { ...x, participants: { ...x.participants, [c.peer]: { id: c.peer, name: d.name, score: 0, combo: 0 } } }; n.connections.forEach(cx => cx.send({ type: 'participants_update', data: n.participants })); return n; });
            else if (d.type === 'score_update') setPeerState(x => { if (!x.participants[c.peer]) return x; const n = { ...x, participants: { ...x.participants, [c.peer]: { ...x.participants[c.peer], ...d.data } } }; n.connections.forEach(cx => cx.send({ type: 'participants_update', data: n.participants })); return n; });
          });
          c.on('close', () => setPeerState(x => ({ ...x, connections: x.connections.filter(cx => cx.peer !== c.peer) })));
        });
      };
      const broadcast = useCallback((d) => pRef.current.connections.forEach(c => c.send(d)), []);

      const initClient = (n, hId) => {
        if (!window.Peer) return showToast('error', '通信準備中');
        const p = new window.Peer();
        p.on('open', () => {
          const c = p.connect(hId);
          c.on('open', () => { c.send({ type: 'join', name: n }); setPeerState(x => ({ ...x, role: 'client', peer: p, conn: c, myName: n })); setView('clientWait'); });
          c.on('data', (d) => { if (d.type === 'game_start') { setState(pv => ({ ...pv, ...d.data })); setView('game'); } else if (d.type === 'game_finish') setView('result'); else if (d.type === 'participants_update') setPeerState(x => ({ ...x, participants: d.data })); });
        });
      };

      const leave = () => { if (peerState.peer) peerState.peer.destroy(); setPeerState({ role: null, peer: null, conn: null, hostId: null, myName: '', connections: [], participants: {} }); setView('home'); };

      const GlobalStyle = () => {
        const v = `--bg: #F4F1DE; --primary: #E07A5F; --secondary: #81B29A; --accent: #F2CC8F; --text: #3D405B; --panel: #FFFFFF; --border: #e5e0c8;`;
        return <style>{`:root { ${v} }`}</style>;
      };

      return (
        <div className="flex flex-col h-[100dvh] w-full transition-colors duration-500">
          <GlobalStyle />
          {view !== 'game' && (
            <header className="flex-shrink-0 bg-[var(--panel)] border-b-2 border-[var(--border)] py-3 px-5 flex justify-between items-center z-50 shadow-sm">
              <div className="flex items-center gap-3">
                <a href="https://hot-spring-egg.github.io/ontama-drill/" className="bg-[var(--bg)] border-2 border-[var(--border)] rounded-lg px-2 py-1 text-xs font-bold text-[var(--text)] flex items-center gap-1 hover:bg-[var(--secondary)] hover:text-white transition-colors" onClick={() => audioCtrl.playSE('click')}>
                  <i className="bi bi-arrow-left"></i> <span className="hidden sm:inline">ドリルに</span>もどる
                </a>
                <div className="flex items-center cursor-pointer gap-2" onClick={() => { audioCtrl.playSE('click'); peerState.role ? leave() : setView('home'); }}>
                  <div className="text-[var(--primary)]"><i className="bi bi-journal-text text-2xl"></i></div>
                  <h1 className="text-xl sm:text-2xl font-black tracking-widest text-[var(--text)] hidden sm:block">ケイサンアタック<span className="text-[var(--primary)]">！</span></h1>
                </div>
              </div>
              <button onClick={() => setIsMuted(audioCtrl.toggle())} className="text-2xl opacity-50 hover:opacity-100 transition-opacity"><i className={`bi ${isMuted ? 'bi-volume-mute' : 'bi-volume-up text-[var(--primary)]'}`}></i></button>
            </header>
          )}
          <main className="flex-grow relative overflow-hidden">
            <AnimatePresence mode="wait">
              {view === 'loading' && <PageWrapper key="L"><Loading /></PageWrapper>}
              {view === 'home' && <PageWrapper key="H"><HomeView setView={setView} stats={stats} setStats={setStats} setConfigMode={setConfigMode} initHost={initHost} globalScore={globalScore} addGlobalScore={addGlobalScore} kadai={kadai} onStartKadai={startKadai} onCloseKadai={closeKadai} /></PageWrapper>}
              {view === 'singleConfig' && <PageWrapper key="SC"><SingleConfigView setView={setView} setState={setState} configMode={configMode} /></PageWrapper>}
              {view === 'hostRoom' && <PageWrapper key="HR"><HostRoomView peerState={peerState} setPeerState={setPeerState} broadcast={broadcast} setView={setView} setState={setState} configMode={configMode} setConfigMode={setConfigMode} /></PageWrapper>}
              {view === 'clientJoin' && <PageWrapper key="CJ"><ClientJoinView initClient={initClient} urlHostId={urlHostId} setView={setView} /></PageWrapper>}
              {view === 'clientWait' && <PageWrapper key="CW"><ClientWaitView peerState={peerState} leaveRoom={leave} /></PageWrapper>}
              {view === 'game' && <PageWrapper key="G"><GameView state={state} setState={setState} setView={setView} stats={stats} setStats={setStats} peerState={peerState} setPeerState={setPeerState} addGlobalScore={addGlobalScore} /></PageWrapper>}
              {view === 'result' && <PageWrapper key="R"><ResultView state={state} setView={setView} peerState={peerState} leaveRoom={leave} onStartKadai={startKadai} /></PageWrapper>}
              {view === 'manager' && <PageWrapper key="M"><ManagerView setView={setView} /></PageWrapper>}
              {view === 'import' && <PageWrapper key="I"><ImportView setView={setView} /></PageWrapper>}
            </AnimatePresence>
          </main>
          <CustomToast />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
